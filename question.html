<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="questionSideBarGrid">
        <div class="sideBar">
            <h1>Score</h1>
            <div id="scorePercentage" class="score-display">0%</div>
            <div id="progressTracker" class="progress-tracker"></div>
        </div>
        <div class="questionBox">
                <div id="questionText"></div>
                <div id="options"></div>
                    <div class="button-container">
                        <button class="nav-button" onclick="previousQuestion()">Previous</button>
                        <button class="nav-button" onclick="nextQuestion()">Next</button>
                        <button class="nav-button right-align" onclick="goToIndex()">Home</button>
                    </div>
                    <div id="explanation" class="explanation-box"></div>
        <!-- Load data FIRST -->
        <script src="data.js"></script>

        <!-- Then logic -->
        <script src="question.js"></script> 
        </div>
    </div>
</body>
</html>
